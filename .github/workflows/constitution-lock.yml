name: Constitution Lock & Architectural Consistency

on:
  pull_request:
    paths:
      - 'constitutional_layer_immutable/**'
      - 'memory_systems/codebase_memory/**'
      - 'tests_ci_cd/**'
      - '**/*.py'
      - '.github/workflows/constitution-lock.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'constitutional_layer_immutable/**'
      - 'memory_systems/codebase_memory/**'
      - 'tests_ci_cd/**'
      - '**/*.py'
      - '.github/workflows/constitution-lock.yml'

jobs:
  protect-immutable-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history to compare changes

      - name: Detect immutable file changes
        id: detect-changes
        run: |
          IMMUTABLE_FILES=("constitutional_layer_immutable/constitution.md" "constitutional_layer_immutable/constitution.py" "constitutional_layer_immutable/CODING_CONSTITUTION.md")
          CHANGED_FILES=""
          
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # For PRs, check if immutable files were modified
            for file in "${IMMUTABLE_FILES[@]}"; do
              if git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep -q "${file}"; then
                CHANGED_FILES="${CHANGED_FILES} ${file}"
                echo "changed=true" >> $GITHUB_OUTPUT
              fi
            done
          else
            # For pushes, check if immutable files were modified in the last commit
            for file in "${IMMUTABLE_FILES[@]}"; do
              if git diff --name-only HEAD~1 HEAD | grep -q "${file}"; then
                CHANGED_FILES="${CHANGED_FILES} ${file}"
                echo "changed=true" >> $GITHUB_OUTPUT
              fi
            done
          fi
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "files=${CHANGED_FILES}" >> $GITHUB_OUTPUT
          fi

      - name: Block immutable file modification
        if: steps.detect-changes.outputs.changed == 'true'
        run: |
          echo "::error::Rule 3 Violation: Immutable files cannot be altered or amended under any circumstance."
          echo "::error::The following files are protected:"
          echo "${{ steps.detect-changes.outputs.files }}"
          echo "::error::Only the Owner may modify these files through a formal Constitutional Proposal."
          exit 1

      - name: Immutable files protected
        if: steps.detect-changes.outputs.changed == 'false'
        run: |
          echo "✓ Immutable files (constitution.md, constitution.py, CODING_CONSTITUTION.md) are protected and unchanged."

  architectural-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic

      - name: Run architectural consistency tests
        run: |
          pytest "tests_ci_cd/tests/test_architectural_consistency.py" -v

      - name: Verify models/core.py exists
        run: |
          if [ ! -f "models/core.py" ]; then
            echo "::error::models/core.py must exist (Rule 8: Minimum Model Requirements)"
            exit 1
          fi
          echo "✓ models/core.py exists"

      - name: Verify CODING_CONSTITUTION.md exists
        run: |
          if [ ! -f "constitutional_layer_immutable/CODING_CONSTITUTION.md" ]; then
            echo "::error::constitutional_layer_immutable/CODING_CONSTITUTION.md must exist"
            exit 1
          fi
          echo "✓ constitutional_layer_immutable/CODING_CONSTITUTION.md exists"

      - name: Check for required models
        run: |
          python -c "
          import sys
          from pathlib import Path
          project_root = Path('.')
          sys.path.insert(0, str(project_root))
          try:
              from models.core import Vote, VoteResult, Proposal, BoardSession, BoardMember, ConstitutionalError
              print('✓ All required models exist in models/core.py')
          except ImportError as e:
              print(f'::error::Required model missing: {e}')
              sys.exit(1)
          "

